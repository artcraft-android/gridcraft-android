name: Build APK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        default: debug
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Test Rust engine and Android bridge
        run: cargo test --workspace --exclude gridcraft-android-bindgen --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: apps/gridcraft-android/android
        run: |
          chmod +x ./gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease testDebugUnitTest
          else
            ./gradlew assembleDebug testDebugUnitTest
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gridcraft-${{ inputs.variant || 'debug' }}-apk
          path: apps/gridcraft-android/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
