[package]
name = "gridcraft-android-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "uniffi-bindgen for gridcraft-android: generates its Kotlin bindings from the built library (the Android build runs it)"

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The release gridcraft-android uses (same lock file): bindings only load against their own release.
uniffi = { version = "=0.32.2", features = ["cli"] }
